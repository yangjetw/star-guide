name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build a clean Pages artifact
        run: |
          staging_dir="${{ runner.temp }}/pages-staging"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          cp index.html styles.css .nojekyll "$staging_dir/"
          cp -R assets/ "$staging_dir/assets/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-staging
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
